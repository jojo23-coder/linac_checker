<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07131f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Årskontroll">
    <title>Årskontroll TrueBeam</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-title">
          <span class="kicker">Årskontroll</span>
          <strong id="session-title"></strong>
        </div>
        <span id="overall" class="status-pill"></span>
      </div>
      <nav id="tabs" class="tabs" aria-label="Delar av kontrollen"></nav>
    </header>

    <p id="notice" class="notice" role="status" hidden></p>

    <main id="view" class="app-shell"></main>

    <div id="report-view" class="report-view" hidden>
      <div class="report-toolbar">
        <button type="button" class="button" data-action="close-report">‹ Tillbaka</button>
        <button type="button" class="button button-primary" data-action="print">Skriv ut / spara som PDF</button>
      </div>
      <div id="report" class="report-paper"></div>
    </div>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <noscript><p class="app-shell">Appen behöver JavaScript.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
